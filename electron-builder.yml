# Vespera — electron-builder configuration
# Builds real, double-clickable desktop apps:
#   Windows : Vespera-Setup-<v>.exe (classic wizard installer) + Vespera-Portable-<v>.exe
#   macOS   : Vespera-<v>-mac-arm64.dmg + Vespera-<v>-mac-x64.dmg
#   Linux   : Vespera-<v>-linux-x64.AppImage + Vespera-<v>-linux-x64.deb
#
# Icons are generated by `npm run icons` (scripts/generate-icons.js).

appId: app.vespera.browser
productName: Vespera
copyright: Copyright © 2026 Vespera Community
executableName: Vespera
electronVersion: 33.4.11
# Use the Electron already installed in node_modules instead of downloading and
# re-extracting a zip at build time. Besides being faster, this avoids the
# Windows Defender filter-driver race that transiently locks the freshly
# extracted default_app.asar during the .tmp staging rename (EBUSY build fails).
electronDist: node_modules/electron/dist

directories:
  output: dist
  buildResources: build

# Packed asar archive. On some machines (Malwarebytes' mbamchameleon driver)
# an unpacked build fails: electron-builder must delete Electron's
# resources/default_app.asar, and the AV holds that handle, so the pack step
# dies with EBUSY. With asar: true the builder simply writes app.asar next to
# it and never has to unlink the locked file.
asar: true
asarUnpack:
  - "src/shared/**"   # required by dynamic import() of .mjs at runtime

files:
  - electron/**/*
  - src/**/*
  - server/**/*
  - package.json
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,readme.md,readme.txt}"

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: Vespera-${version}-win-${arch}.${ext}

nsis:
  # Classic install wizard with a "Run Vespera" checkbox on the Finish page.
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Vespera
  uninstallDisplayName: Vespera Browser
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  # Preserve local Vespera data (accounts, history, settings) when uninstalling.
  deleteAppDataOnUninstall: false
  artifactName: Vespera-Setup-${version}.${ext}

portable:
  artifactName: Vespera-Portable-${version}.${ext}

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  darkModeSupport: true
  artifactName: Vespera-${version}-${os}-${arch}.${ext}

dmg:
  artifactName: Vespera-${version}-${os}-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icons
  category: Network
  maintainer: Vespera Community <vespera@users.noreply.github.com>
  vendor: Vespera Community
  synopsis: A private, community-first Chromium browser
  description: >-
    Vespera is a next-gen browser engineered for absolute privacy —
    zero telemetry, built-in tracker and ad blocking, and a community-voted roadmap.
  artifactName: Vespera-${version}-${os}-${arch}.${ext}
  syncDesktopName: true
