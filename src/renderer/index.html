<!doctype html>
<html lang="en" data-theme="dark" data-accent="gold">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Vespera</title>
  <meta name="theme-color" content="#0a0e1c">
  <meta name="application-name" content="Vespera">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vespera">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icon-256.png">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/chrome.css">
  <link rel="stylesheet" href="styles/pages.css">
  <link rel="stylesheet" href="styles/default-browser.css">
  <link rel="stylesheet" href="styles/tab-settings.css">
  <link rel="stylesheet" href="styles/interactions.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f6b93b' d='M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z'/%3E%3C/svg%3E">
</head>
<body>
  <div id="app">
    <!-- Titlebar + tab strip (horizontal mode) -->
    <header class="titlebar" id="titlebar">
      <div class="tabstrip no-drag" id="tabstrip" role="tablist" aria-label="Browser tabs"></div>
      <button class="newtab-btn group-create-btn no-drag" id="btn-new-group" title="Create a group for this tab" aria-label="Create tab group">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 7.5h7l2 2H20a1.5 1.5 0 011.5 1.5v7a2 2 0 01-2 2h-14a2 2 0 01-2-2z"/><path d="M15 13v5m-2.5-2.5h5"/></svg>
      </button>
      <button class="newtab-btn no-drag" id="btn-newtab" title="New tab (Ctrl+T)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div class="window-controls no-drag" id="window-controls">
        <button id="wc-min" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 6h7"/></svg></button>
        <button id="wc-max" title="Maximize" aria-label="Maximize"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="8" height="8" rx="2"/></svg></button>
        <button id="wc-close" class="wc-close" title="Close" aria-label="Close"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3.25 3.25l5.5 5.5M8.75 3.25l-5.5 5.5"/></svg></button>
      </div>
    </header>

    <!-- Toolbar (horizontal mode) -->
    <div class="toolbar" id="toolbar">
      <button class="icon-btn" id="btn-back" title="Back (Alt+←)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="icon-btn" id="btn-forward" title="Forward (Alt+→)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="icon-btn" id="btn-reload" title="Reload (Ctrl+R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
      <button class="icon-btn" id="btn-home" title="Home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></button>

      <div class="omnibox-wrap" id="omnibox-wrap">
        <div class="omnibox" id="omnibox">
          <div class="site-info" id="site-info">
            <svg class="lock" id="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg>
          </div>
          <input id="omni-input" type="text" spellcheck="false" autocomplete="off"
                 placeholder="Search the web or type a URL" aria-label="Address bar">
          <span class="engine-tag" id="engine-tag">Startpage</span>
          <button class="icon-btn go-btn" id="omni-go" title="Go">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="suggestions hidden" id="suggestions"></div>
      </div>

      <button class="icon-btn shield-btn" id="btn-shields" title="Vespera Shields">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        <span class="count" id="shield-count" data-zero="true">0</span>
      </button>
      <div class="extension-actions" id="extension-actions" role="group" aria-label="Pinned extension actions"></div>
      <button class="icon-btn" id="btn-extensions" title="Extensions" aria-label="Extensions" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 01-2 2H4v4h3a2 2 0 012 2v3h4v-3a2 2 0 012-2h3V8h-3a2 2 0 01-2-2V3z"/></svg></button>
      <button class="icon-btn" id="btn-downloads" title="Recent downloads" aria-label="Recent downloads" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg></button>
      <button class="icon-btn" id="btn-bookmark" title="Bookmark this page (Ctrl+D)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 012-2h10a2 2 0 012 2z"/></svg></button>
      <button class="icon-btn" id="btn-palette" title="Command palette (Ctrl+K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg></button>
      <button class="icon-btn" id="btn-menu" title="Toggle Menu" aria-label="Toggle Menu" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></button>
    </div>

    <!-- Main row: sidebar + content -->
    <div class="main-row" id="main-row">
      <nav class="sidebar" id="sidebar">
        <div class="vtabs" id="vtabs">
          <div class="vtabs-head"><span>Your tabs <span class="chip" data-tab-count>1</span></span><span class="vtabs-head-actions"><button class="icon-btn" id="btn-hide-vt" title="Show tabs on top" aria-label="Show tabs on top"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg></button><button class="icon-btn" id="btn-newtab-vt" title="New tab" aria-label="New tab">+</button></span></div>
          <div class="vtabs-list" id="vtabs-list" role="tablist" aria-label="Browser tabs"></div>
          <div class="vtabs-foot" id="vtabs-foot"></div>
        </div>
        <div class="rail" id="rail"></div>
      </nav>
      <div class="content-col">
        <div class="preview-banner" id="preview-banner">
          <span class="preview-dot"></span><span id="preview-label">Vespera is running live · Some sites may limit embedded pages</span>
          <button class="text-btn" id="preview-details">Details</button>
          <button class="text-btn hidden" id="open-original">Open original ↗</button>
          <button class="icon-btn soft-close" id="dismiss-preview" title="Dismiss preview notice" aria-label="Dismiss preview notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <!-- Shown on Chrome Web Store pages: Google blocks "Add to Chrome" outside Chrome. -->
        <div class="store-banner hidden" id="store-banner">
          <span class="store-banner-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v3a2 2 0 01-2 2H4v4h3a2 2 0 012 2v3h4v-3a2 2 0 012-2h3V8h-3a2 2 0 01-2-2V3z"/><path d="M9 21h6v-3a2 2 0 012-2h3"/></svg></span>
          <span class="store-banner-text"><b>Chrome Web Store</b><span id="store-banner-copy">Google only lets Chrome install extensions — Vespera can install this one for you.</span></span>
          <button class="btn btn-primary" id="store-install"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg> Install in Vespera</button>
          <button class="icon-btn soft-close" id="store-dismiss" title="Dismiss" aria-label="Dismiss Chrome Web Store notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="toolbar-vt" id="toolbar-vt"></div>
        <div class="bookmarks-bar hidden" id="bookmarks-bar" aria-label="Bookmarks bar"></div>
        <div class="find-bar hidden" id="find-bar">
          <input id="find-input" class="input" placeholder="Find in page…" aria-label="Find in page">
          <span id="find-count" class="small muted"></span>
          <button class="icon-btn" id="find-prev" title="Previous match">↑</button>
          <button class="icon-btn" id="find-next" title="Next match">↓</button>
          <button class="icon-btn soft-close" id="find-close" title="Close find" aria-label="Close find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        </div>
        <div class="content" id="content" role="tabpanel" aria-label="Active tab content"></div>
        <button class="rail-reveal" id="btn-show-rail" hidden title="Show sidebar" aria-label="Show sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M5.5 8h1M5.5 12h1"/></svg></button>
        <footer class="status-bar"><span id="page-status">Ready</span><span class="grow"></span><span id="zoom-status">100%</span><span><span data-tab-count>1</span> tabs</span><span id="runtime-status">Web preview</span></footer>
      </div>
    </div>
  </div>

  <div class="web-window-dock hidden" id="web-window-dock"><span class="dock-star">✦</span><div><b>Vespera</b><div class="small muted" id="dock-description">Your tabs are still here.</div></div><button class="btn btn-primary" id="web-restore">Restore</button></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
