name: CI

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and renderer tests
        run: npm test

  check:
    name: Rust core compiles on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Compile the Tauri core
        shell: bash
        run: cargo check --color never --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-check.log

      - name: Report Rust diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f cargo-check.log ]]; then
            while IFS= read -r line; do
              case "$line" in
                error:*|error\[*|*"--> "*|*"= note:"*|*"= help:"*)
                  message="${line//'%'/'%25'}"
                  message="${message//$'\r'/'%0D'}"
                  printf '::error title=Rust compile detail::%s\n' "$message"
                  ;;
              esac
            done < cargo-check.log
            {
              echo '### Rust compiler diagnostics'
              echo '```text'
              grep -E '^(error(\\[|:)|[[:space:]]+--> |[[:space:]]+= (note|help):)' cargo-check.log || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compile log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log-${{ matrix.os }}
          path: cargo-check.log
          if-no-files-found: ignore

      - name: Report compile errors on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo '## ❌ Rust core compile errors on ${{ matrix.os }}'
            echo ''
            echo '```'
            cat cargo-check.log
            echo '```'
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
