name: Build and publish Vespera

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish; leave blank for build-only.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate installer icons
        run: npm run icons

      - name: Build Windows installers
        if: runner.os == 'Windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win --publish never

      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Build Ubuntu/Linux installers
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Upload installer files
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Publish pushed v* tags or an explicitly selected tag in a manual run.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' &&
       startsWith(github.event.inputs.release_tag, 'v'))

    steps:
      - name: Check out repository for release metadata
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}
          # gh release --generate-notes needs Git history and repository context.
          fetch-depth: 0

      - name: Download installers from all platforms
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          mapfile -d '' all_files < <(find release-files -type f -print0 | sort -z)
          installer_assets=()
          for file in "${all_files[@]}"; do
            case "${file##*/}" in
              Vespera-Setup-*.exe|Vespera-Portable-*.exe|Vespera-*-mac-arm64.dmg|Vespera-*-mac-x64.dmg|Vespera-*-linux-x64.AppImage|Vespera-*-linux-x64.deb)
                installer_assets+=("$file")
                ;;
            esac
          done
          if (( ${#installer_assets[@]} != 6 )); then
            echo "Expected 6 installer files; found ${#installer_assets[@]}." >&2
            printf 'Found: %s\n' "${installer_assets[@]}" >&2
            exit 1
          fi
          printf 'Uploading installers:\n'
          printf '  %s\n' "${installer_assets[@]}"
          gh release create "$RELEASE_TAG" "${installer_assets[@]}" --title "$RELEASE_TAG" --generate-notes
