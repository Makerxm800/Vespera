name: Build release files

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22" # Change this if your project needs another version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Assumes the build creates a "dist" folder.
      - name: Package Windows files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/* -DestinationPath release/myapp-windows.zip

      - name: Package macOS files
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          tar -czf release/myapp-macos.tar.gz -C dist .

      - name: Package Ubuntu/Linux files
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -czf release/myapp-ubuntu.tar.gz -C dist .

      - name: Upload build files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Publish only when started by pushing a v* tag.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download build files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
