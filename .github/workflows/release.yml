name: Build and publish Vespera

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate installer icons
        run: npm run icons

      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Build Ubuntu/Linux installers
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Upload installer files
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: dist/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Publish a release for pushed v* tags, not manual branch runs.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download installers from all platforms
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release and attach installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
