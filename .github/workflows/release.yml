name: Build and publish Vespera

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish; leave blank for build-only.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            bundles: msi,nsis
          - os: macos-13
            arch: x64
            bundles: dmg
          - os: macos-14
            arch: arm64
            bundles: dmg
          - os: ubuntu-latest
            arch: x86_64
            bundles: deb,appimage

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate installer icons
        run: npm run icons

      - name: Build with Tauri
        run: npx tauri build --bundles ${{ matrix.bundles }} 2>&1 | tee /tmp/tauri-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log to Gist (on failure)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Build log: ${{ matrix.os }} (${{ matrix.arch }})"
            echo ""
            echo '```'
            tail -200 /tmp/tauri-build.log
            echo '```'
          } > /tmp/gist.md
          gh gist create /tmp/gist.md --desc "vespera-build-failure-${{ matrix.os }}-${{ matrix.arch }}"

      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vespera-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(echo "${{ github.event.inputs.release_tag || github.ref }}" | sed 's#refs/tags/##')"
          SHA="${{ github.sha }}"
          # Release notes: the top version section of the changelog.
          NOTES="$(awk '/^## /{n++} n==1' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="Vespera $TAG"
          gh release create "$TAG" \
            --title "Vespera $TAG" \
            --notes "$NOTES" \
            --target "$SHA" \
            installers/*/* \
            || gh release upload "$TAG" installers/*/*
