name: Build and publish Vespera

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish; leave blank for build-only.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            bundles: msi,nsis
          - os: macos-13
            arch: x64
            bundles: dmg
          - os: macos-14
            arch: arm64
            bundles: dmg
          - os: ubuntu-latest
            arch: x86_64
            bundles: deb,appimage

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate installer icons
        run: npm run icons

      - name: Build with Tauri
        run: npx tauri build --bundles ${{ matrix.bundles }} 2>&1 | tee /tmp/tauri-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List bundle output
        if: always()
        run: |
          echo "=== Bundle tree ===" >> "$GITHUB_STEP_SUMMARY"
          find src-tauri/target/release/bundle -type f 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "no bundle dir" >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Collect installers
        if: success()
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \
            \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) \
            -exec cp {} dist/ \; 2>/dev/null || true
          ls -la dist/

      - name: Report failure summary
        if: failure()
        run: |
          {
            echo "## ❌ Build failed: ${{ matrix.os }} (${{ matrix.arch }})"
            echo ""
            echo '```'
            tail -150 /tmp/tauri-build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vespera-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: List downloaded installers
        run: find installers -type f | sort

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="$(echo "${{ github.event.inputs.release_tag || github.ref }}" | sed 's#refs/tags/##')"
          SHA="${{ github.sha }}"
          # Release notes: the top version section of the changelog.
          NOTES="$(awk '/^## /{n++} n==1' CHANGELOG.md)"
          [ -z "$NOTES" ] && NOTES="Vespera $TAG"
          # Collect all installer files (artifacts may be nested in subdirs).
          FILES=$(find installers -type f \
            \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) \
            | tr '\n' ' ')
          [ -z "$FILES" ] && { echo "No installers found"; exit 1; }
          gh release create "$TAG" \
            --title "Vespera $TAG" \
            --notes "$NOTES" \
            --target "$SHA" \
            $FILES \
            || gh release upload "$TAG" $FILES
