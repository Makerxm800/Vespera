# Vespera — Build & Release
#
# Runs on pull requests for validation. Version-tag pushes publish releases;
# merging a commit titled "Release Vespera vX.Y.Z" to main also builds and
# publishes that package version automatically.

name: Build & Release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui

  build:
    name: Build (${{ matrix.platform }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            script: dist:win
            artifacts: "dist/*.exe"
          - platform: macOS
            os: macos-latest
            script: dist:mac
            artifacts: "dist/*.dmg"
          - platform: Linux
            os: ubuntu-latest
            script: dist:linux
            artifacts: |
              dist/*.AppImage
              dist/*.deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # No Apple/Windows code-signing certs in this repo — skip auto-discovery
      # so builds succeed. Users bypass Gatekeeper/SmartScreen once (documented).
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build installers
        run: |
          set -o pipefail
          npm run ${{ matrix.script }} 2>&1 | tee build.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.platform }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'Release Vespera v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then RELEASE_TAG="$GITHUB_REF_NAME"; fi
          gh release create "$RELEASE_TAG" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$GITHUB_SHA" \
            --title "Vespera ${RELEASE_TAG}" \
            --generate-notes || \
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
