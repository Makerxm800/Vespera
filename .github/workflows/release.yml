name: Build and publish Vespera

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v* tag to build and publish; leave blank for build-only.
        required: false
        type: string
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            bundles: msi,nsis
          - os: macos-15-intel
            arch: x64
            bundles: dmg
          - os: macos-15
            arch: arm64
            bundles: dmg
          - os: ubuntu-latest
            arch: x86_64
            bundles: deb,appimage

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate installer icons
        run: npm run icons

      - name: Build with Tauri
        shell: bash
        run: npx tauri build --bundles "${{ matrix.bundles }}" 2>&1 | tee tauri-build.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report build failure details
        if: failure()
        shell: bash
        run: |
          if [[ -s tauri-build.log ]]; then
            {
              echo '### Tauri build failure details'
              echo '```text'
              tail -n 100 tauri-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -iE 'error:|failed|not found|no such file' tauri-build.log | tail -n 40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              printf '::error::%s\n' "$line"
            done
          else
            echo 'No Tauri build log was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Collect installers
        if: success()
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target/release/bundle -type f \
            \( -iname '*.msi' -o -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.appimage' \) \
            -exec cp {} dist/ \;
          echo 'Installer files:'
          find dist -maxdepth 1 -type f -print
          test -n "$(find dist -maxdepth 1 -type f -print -quit)" || {
            echo 'No installers were generated.' >&2
            find src-tauri/target/release/bundle -maxdepth 4 -print 2>/dev/null || true
            exit 1
          }

      - name: Upload installers
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: vespera-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            tauri-build.log
            src-tauri/target/release/bundle/
          if-no-files-found: ignore
          retention-days: 7

      - name: Summarize build outputs
        if: always()
        shell: bash
        run: |
          {
            echo '### ${{ matrix.os }} (${{ matrix.arch }}) output'
            echo '```'
            find src-tauri/target/release/bundle -maxdepth 4 -type f 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.release_tag || github.ref }}

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: vespera-*
          merge-multiple: true

      - name: Publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG:-$PUSH_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish invalid release tag: $TAG" >&2
            exit 1
          fi

          mapfile -d '' -t FILES < <(find installers -type f \
            \( -iname '*.msi' -o -iname '*.exe' -o -iname '*.dmg' -o -iname '*.deb' -o -iname '*.appimage' \) \
            -print0 | sort -z)
          if (( ${#FILES[@]} == 0 )); then
            echo 'No installer assets were downloaded.' >&2
            find installers -maxdepth 3 -print || true
            exit 1
          fi

          NOTES="$(awk '/^## /{n++} n==1' CHANGELOG.md)"
          NOTES="${NOTES:-Vespera $TAG}"
          TITLE="Vespera $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            TARGET="$(git rev-parse "$TAG^{commit}")"
            gh release create "$TAG" "${FILES[@]}" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --target "$TARGET"
          fi
