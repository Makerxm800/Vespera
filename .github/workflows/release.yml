name: Build release files

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22" # Change to the version your project needs

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Package Windows files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path dist/* -DestinationPath release/myapp-windows.zip

      - name: Package macOS files
        if: runner.os == 'macOS'
        run: |
          mkdir -p release
          tar -czf release/myapp-macos.tar.gz -C dist .

      - name: Package Ubuntu/Linux files
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -czf release/myapp-ubuntu.tar.gz -C dist .

      - name: Upload packaged files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/*

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest

    # Only publish a GitHub Release for a pushed v* tag.
    # Manual runs from a branch will still build and save artifacts.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all platform files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-files/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
